[package]
name = "tesis-psi"
version = "0.1.0"
description = "App local-first de apoyo a la investigación (PSI-4-SF + COPE-28)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "tesis_psi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
